services:
  turntable-bridge:
    build: .
    container_name: turntable-bridge
    restart: unless-stopped
    # Host networking is required for Bluetooth stack communication & low-latency audio
    network_mode: host
    privileged: true
    volumes:
      # Host Bluetooth D-Bus socket & hardware dev nodes
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /dev:/dev
    environment:
      - TURNTABLE_MAC=AD:60:17:9B:D5:AC
      - ICECAST_SOURCE_PASSWORD=${ICECAST_SOURCE_PASSWORD:-hackme}
      - ICECAST_ADMIN_PASSWORD=${ICECAST_ADMIN_PASSWORD:-hackme}
      - HASS_URL=${HASS_URL:-http://homeassistant.local:8123}
      - HASS_TOKEN=${HASS_TOKEN:-}
      - SONOS_ENTITY_ID=${SONOS_ENTITY_ID:-media_player.menjador_sonos_2}
      - SONOS_STREAM_URL=${SONOS_STREAM_URL:-http://192.168.1.39:8080/sonos.mp3}
